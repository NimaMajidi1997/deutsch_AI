name: Build and Deploy deutschAI

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

# Public package on ghcr.io (set to public once after the first push), so the server pulls
# without logging in. Must be lowercase.
env:
  IMAGE: ghcr.io/nimamajidi1997/deutschai

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH for server
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_SERVER }}

      # Pinned host key (secret SSH_KNOWN_HOSTS = output of `ssh-keyscan <server-ip>`),
      # so the runner refuses to talk to anything pretending to be the server.
      - name: Trust server host key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy on server
        env:
          SERVER: "nima@${{ secrets.SERVER_IP }}"
        run: |
          scp .github/scripts/deploy.sh "$SERVER:/tmp/deutschai-deploy.sh"
          ssh "$SERVER" "bash /tmp/deutschai-deploy.sh '${{ env.IMAGE }}:${{ github.sha }}'"
